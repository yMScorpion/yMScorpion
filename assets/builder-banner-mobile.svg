<svg xmlns="http://www.w3.org/2000/svg" width="480" height="310" viewBox="0 0 480 310" role="img"><title>builder banner mobile</title><style>text{font-family:Arial,sans-serif}.mono{font-family:monospace}.reveal{animation:reveal 1.8s ease-out both}@keyframes reveal{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:translateY(0)}}.draw{stroke-dasharray:1400;stroke-dashoffset:1400;animation:draw 2s ease-out forwards}@keyframes draw{to{stroke-dashoffset:0}}@media(prefers-reduced-motion:reduce){.reveal,.draw{animation:none;opacity:1;stroke-dashoffset:0}}</style><rect width="480" height="310" rx="16" fill="#101412"/><text x="25" y="35" fill="#a3e635" font-size="15" class="mono" >iv_ / THE BUILDER</text><g class="reveal"><text x="25" y="105" fill="#f4f2e9" font-size="32" class="" >Behind every line</text><text x="25" y="149" fill="#f4f2e9" font-size="32" class="" >of code, there</text><text x="25" y="193" fill="#a3e635" font-size="38" class="" >is a builder.</text><text x="25" y="250" fill="#f4f2e9" font-size="14" class="mono" >ISAAC VALERIANO</text><text x="25" y="278" fill="#aeb8af" font-size="15" class="" >Back-End · Applied AI · Cloud</text></g></svg>